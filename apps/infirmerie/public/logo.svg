<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Blue Spherical Meridian & Orbital Lines -->
  <g fill="none" stroke-linecap="round">
    <!-- Horizontal & Tilted Orbital Rings -->
    <ellipse cx="250" cy="230" rx="195" ry="195" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" />
    <ellipse cx="250" cy="235" rx="180" ry="180" stroke="#0ea5e9" stroke-width="3" opacity="0.65" />
    <ellipse cx="250" cy="235" rx="190" ry="55" stroke="#0284c7" stroke-width="3.5" transform="rotate(-15 250 235)" />
    <ellipse cx="250" cy="240" rx="175" ry="48" stroke="#38bdf8" stroke-width="3" transform="rotate(22 250 240)" />
    <ellipse cx="250" cy="230" rx="160" ry="40" stroke="#0ea5e9" stroke-width="3" transform="rotate(-35 250 230)" />
    <ellipse cx="250" cy="230" rx="150" ry="190" stroke="#0284c7" stroke-width="3.5" transform="rotate(-25 250 230)" />
    <ellipse cx="250" cy="235" rx="110" ry="185" stroke="#38bdf8" stroke-width="3" transform="rotate(18 250 235)" />
    <ellipse cx="250" cy="230" rx="60" ry="180" stroke="#0ea5e9" stroke-width="3" transform="rotate(-8 250 230)" />
    <ellipse cx="250" cy="235" rx="185" ry="90" stroke="#0369a1" stroke-width="2.5" opacity="0.8" />
    <ellipse cx="250" cy="235" rx="140" ry="70" stroke="#0284c7" stroke-width="2.5" opacity="0.75" />

    <!-- Expressive swirling orbital arcs -->
    <path d="M 80 180 C 120 70, 320 60, 420 170 C 470 230, 430 350, 370 390" stroke="#0ea5e9" stroke-width="3.5" />
    <path d="M 430 200 C 410 90, 240 80, 110 220 C 60 280, 80 370, 180 415" stroke="#38bdf8" stroke-width="3.5" />
    <path d="M 120 330 C 180 430, 340 430, 400 320" stroke="#0284c7" stroke-width="3.2" />
    <path d="M 150 140 C 230 110, 330 130, 390 220" stroke="#0ea5e9" stroke-width="2.8" />
  </g>

  <!-- Central Ascending Pentecost / Spirit Flame -->
  <g id="flames">
    <!-- Base Glow -->
    <path d="M 235 440 C 220 380, 230 320, 240 280 C 250 320, 265 370, 255 440 C 248 455, 240 455, 235 440 Z" fill="url(#flameGrad)" opacity="0.9" />
    <!-- Lower Flame Body -->
    <path d="M 245 445 C 230 400, 220 340, 245 270 C 260 330, 275 390, 252 445 Z" fill="url(#flameInner)" />
    <!-- Mid Flame Layer -->
    <path d="M 248 350 C 235 290, 240 230, 250 160 C 262 210, 270 280, 252 350 Z" fill="url(#flameGrad)" />
    <path d="M 242 320 C 232 260, 245 200, 252 140 C 258 190, 266 250, 248 320 Z" fill="url(#flameInner)" opacity="0.85" />
    <!-- Upper Flame Tip -->
    <path d="M 252 200 C 248 140, 250 80, 254 20 C 258 70, 264 130, 254 200 Z" fill="url(#flameGrad)" />
    <!-- Decorative side tongues of flame -->
    <path d="M 246 290 C 238 270, 232 245, 240 220 C 245 240, 248 265, 248 290 Z" fill="url(#flameGrad)" />
    <path d="M 254 270 C 262 250, 268 225, 260 190 C 255 220, 252 245, 254 270 Z" fill="url(#flameGrad)" />
    <path d="M 250 160 C 244 135, 242 110, 248 85 C 252 105, 254 130, 250 160 Z" fill="url(#flameInner)" />
  </g>

  <!-- Grandir Ensemble Calligraphic Script -->
  <g fill="#1e1e1e" style="font-family: 'Brush Script MT', 'Dancing Script', 'Great Vibes', 'Segoe Script', cursive, sans-serif;">
    <text x="250" y="525" text-anchor="middle" font-size="62" font-style="italic" font-weight="600" letter-spacing="1">
      Grandir Ensemble
    </text>
  </g>
</svg>
